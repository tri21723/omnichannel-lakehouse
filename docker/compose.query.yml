# Profile query: read-only Trino 484 over Iceberg (Lakekeeper REST + MinIO) and PostgreSQL
# (ADR-0015). Always merged with compose.core.yml and compose.batch.yml.
services:
  trino:
    image: ${TRINO_IMAGE:-trinodb/trino:484}
    profiles:
    - query
    environment:
      TRINO_ICEBERG_REST_URI: ${LAKEKEEPER_URI}/catalog
      TRINO_ICEBERG_WAREHOUSE: ${LAKEHOUSE_WAREHOUSE}
      TRINO_S3_ENDPOINT: ${S3_ENDPOINT}
      TRINO_S3_REGION: ${AWS_DEFAULT_REGION}
      TRINO_S3_ACCESS_KEY: ${TRINO_S3_ACCESS_KEY}
      TRINO_S3_SECRET_KEY: ${TRINO_S3_SECRET_KEY}
      TRINO_RO_DB_PASSWORD: ${TRINO_RO_DB_PASSWORD}
    ports:
    - 127.0.0.1:8083:8080
    mem_limit: 2560m
    volumes:
    - ./query/trino/etc:/etc/trino:ro
    - trino-data:/data/trino
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      lakekeeper:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - /usr/lib/trino/bin/health-check
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
volumes:
  trino-data: {}
