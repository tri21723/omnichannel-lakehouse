# Profile governance: a minimal DataHub (ADR-0018) reusing the platform's PostgreSQL and Kafka.
# Merged with compose.core.yml and compose.stream.yml (only `kafka` is started from stream).
# Governance-only variables default to empty so `make down` works before `make env-gov`.
x-datahub-db: &datahub-db
  EBEAN_DATASOURCE_USERNAME: datahub
  EBEAN_DATASOURCE_PASSWORD: ${DATAHUB_DB_PASSWORD:-}
  EBEAN_DATASOURCE_HOST: postgres:5432
  EBEAN_DATASOURCE_URL: jdbc:postgresql://postgres:5432/datahub
  EBEAN_DATASOURCE_DRIVER: org.postgresql.Driver
x-datahub-common: &datahub-common
  DATAHUB_SYSTEM_CLIENT_SECRET: ${DATAHUB_SYSTEM_CLIENT_SECRET:-}
  DATAHUB_TOKEN_SERVICE_SALT: ${DATAHUB_TOKEN_SERVICE_SALT:-}
  DATAHUB_TOKEN_SERVICE_SIGNING_KEY: ${DATAHUB_TOKEN_SERVICE_SIGNING_KEY:-}
  DATAHUB_GMS_BASE_PATH: /
  DATAHUB_BASE_PATH: /
  ELASTICSEARCH_HOST: datahub-opensearch
  ELASTICSEARCH_PORT: '9200'
  ELASTICSEARCH_PROTOCOL: http
  ELASTICSEARCH_USE_SSL: 'false'
  ELASTICSEARCH_IMPLEMENTATION: opensearch
  ELASTICSEARCH_INDEX_BUILDER_MAPPINGS_REINDEX: 'true'
  ELASTICSEARCH_INDEX_BUILDER_SETTINGS_REINDEX: 'true'
  ENTITY_REGISTRY_CONFIG_PATH: /datahub/datahub-gms/resources/entity-registry.yml
  ENTITY_VERSIONING_ENABLED: 'true'
  GRAPH_SERVICE_IMPL: elasticsearch
  KAFKA_BOOTSTRAP_SERVER: kafka:29092
  KAFKA_SCHEMAREGISTRY_URL: http://datahub-gms:8080/schema-registry/api/
  SCHEMA_REGISTRY_TYPE: INTERNAL
  DATAHUB_TELEMETRY_ENABLED: 'false'

services:
  gov-postgres-init:
    image: ${POSTGRES_IMAGE:?Run make env}
    profiles: [governance]
    entrypoint: [/bin/sh, /bootstrap/postgres-init.sh]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run make env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make env}
      DATAHUB_DB_PASSWORD: ${DATAHUB_DB_PASSWORD:-}
      DATAHUB_RO_DB_PASSWORD: ${DATAHUB_RO_DB_PASSWORD:-}
    volumes:
    - ./governance:/bootstrap:ro

  datahub-opensearch:
    image: ${DATAHUB_OPENSEARCH_IMAGE:-opensearchproject/opensearch:2.19.3}
    profiles: [governance]
    hostname: datahub-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms768m -Xmx1024m -Dlog4j2.formatMsgNoLookups=true
    mem_limit: 1536m
    volumes:
    - datahub-opensearch:/usr/share/opensearch/data
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=0s' >/dev/null
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  datahub-system-update:
    image: acryldata/datahub-upgrade:${DATAHUB_VERSION:-v1.7.0.1}
    profiles: [governance]
    command: [-u, SystemUpdate]
    hostname: datahub-system-update
    environment:
      <<: [*datahub-db, *datahub-common]
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: '8080'
      DATAHUB_PRECREATE_TOPICS: 'true'
      PARTITIONS: '3'
      DATAHUB_SQL_SETUP_ENABLED: 'true'
      ELASTICSEARCH_BUILD_INDICES_CLONE_INDICES: 'false'
      BACKFILL_BROWSE_PATHS_V2: 'true'
      REPROCESS_DEFAULT_BROWSE_PATHS_V2: 'false'
      SCHEMA_REGISTRY_SYSTEM_UPDATE: 'true'
      SPRING_KAFKA_PROPERTIES_AUTO_REGISTER_SCHEMAS: 'true'
      SPRING_KAFKA_PROPERTIES_USE_LATEST_VERSION: 'true'
      USE_CONFLUENT_SCHEMA_REGISTRY: 'false'
      CREATE_USER: 'false'
    mem_limit: 1024m
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      datahub-opensearch:
        condition: service_healthy

  datahub-gms:
    image: acryldata/datahub-gms:${DATAHUB_VERSION:-v1.7.0.1}
    profiles: [governance]
    hostname: datahub-gms
    environment:
      <<: [*datahub-db, *datahub-common]
      DATAHUB_SERVER_TYPE: quickstart
      JAVA_OPTS: -Xms1g -Xmx1g
      MAE_CONSUMER_ENABLED: 'true'
      MCE_CONSUMER_ENABLED: 'true'
      PE_CONSUMER_ENABLED: 'true'
      MCL_CONSUMER_BATCH_ENABLED: 'true'
      MCP_CONSUMER_BATCH_ENABLED: 'true'
      METADATA_SERVICE_AUTH_ENABLED: 'false'
      UI_INGESTION_ENABLED: 'false'
      ENTITY_SERVICE_ENABLE_RETENTION: 'true'
      GRAPH_SERVICE_DIFF_MODE_ENABLED: 'true'
      STRICT_URN_VALIDATION_ENABLED: 'true'
      ALTERNATE_MCP_VALIDATION: 'true'
      DATAHUB_UPGRADE_HISTORY_KAFKA_CONSUMER_GROUP_ID: generic-duhe-consumer-job-client-gms
      DATAHUB_OBJECT_STORAGE_URI: file:///tmp/datahub-object-storage
      USAGE_AGGREGATION_ENABLED: 'false'
    mem_limit: 2048m
    depends_on:
      datahub-system-update:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8080/health >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped

  datahub-frontend:
    image: acryldata/datahub-frontend-react:${DATAHUB_VERSION:-v1.7.0.1}
    profiles: [governance]
    hostname: datahub-frontend
    environment:
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: '8080'
      DATAHUB_GMS_BASE_PATH: /
      DATAHUB_BASE_PATH: /
      DATAHUB_APP_VERSION: ${DATAHUB_VERSION:-v1.7.0.1}
      DATAHUB_SECRET: ${DATAHUB_SECRET:-}
      DATAHUB_SYSTEM_CLIENT_SECRET: ${DATAHUB_SYSTEM_CLIENT_SECRET:-}
      DATAHUB_TRACKING_TOPIC: DataHubUsageEvent_v1
      DATAHUB_PLAY_MEM_BUFFER_SIZE: 10MB
      ELASTIC_CLIENT_HOST: datahub-opensearch
      ELASTIC_CLIENT_PORT: '9200'
      KAFKA_BOOTSTRAP_SERVER: kafka:29092
      PLAY_HTTP_CONTEXT: /
      JAVA_OPTS: >-
        -Xms512m -Xmx512m -Dhttp.port=9002 -Dconfig.file=datahub-frontend/conf/application.conf
        -Djava.security.auth.login.config=datahub-frontend/conf/jaas.conf
        -Dlogback.configurationFile=datahub-frontend/conf/logback.xml -Dpidfile.path=/dev/null
    ports:
    - 127.0.0.1:9002:9002
    mem_limit: 1024m
    volumes:
    # Replaces the image's default `datahub:datahub` login (JAAS accepts any listed file).
    - ../.local-data/governance/user.props:/datahub-frontend/conf/user.props:ro
    depends_on:
      datahub-gms:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:9002/admin >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  datahub-ingest:
    image: omnichannel/datahub-ingest:1.7.0.19
    build:
      context: ..
      dockerfile: docker/images/Dockerfile.datahub-ingest
    profiles: [governance]
    environment:
      DATAHUB_GMS_URL: http://datahub-gms:8080
      DATAHUB_TELEMETRY_ENABLED: 'false'
      DATAHUB_RO_DB_PASSWORD: ${DATAHUB_RO_DB_PASSWORD:-}
      LAKEKEEPER_URI: ${LAKEKEEPER_URI:-}
      LAKEHOUSE_WAREHOUSE: ${LAKEHOUSE_WAREHOUSE:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      TRINO_S3_ACCESS_KEY: ${TRINO_S3_ACCESS_KEY:-}
      TRINO_S3_SECRET_KEY: ${TRINO_S3_SECRET_KEY:-}
    volumes:
    - ../datahub:/app/datahub:ro
    mem_limit: 768m

volumes:
  datahub-opensearch: {}
