# Profile stream: Kafka (KRaft), kafka-ui and a Flink session cluster (ADR-0016).
# Always merged with compose.core.yml; Spark, Airflow and Trino are not needed. Stream-only
# variables default to empty so `make down` works before `make env-stream`; `up-stream` runs it.
x-flink-env: &flink-env
  # S3 credentials come from the environment (S3A default chain), never from config files.
  AWS_ACCESS_KEY_ID: ${FLINK_S3_ACCESS_KEY:-}
  AWS_SECRET_ACCESS_KEY: ${FLINK_S3_SECRET_KEY:-}
  AWS_REGION: ${AWS_DEFAULT_REGION:?Run make env}
  ENABLE_BUILT_IN_PLUGINS: flink-s3-fs-hadoop-2.2.1.jar
  FLINK_PROPERTIES: |
    jobmanager.rpc.address: flink-jobmanager
    jobmanager.memory.process.size: 900m
    taskmanager.memory.process.size: 1800m
    taskmanager.numberOfTaskSlots: 2
    parallelism.default: 1
    s3.endpoint: ${S3_ENDPOINT:?Run make env}
    s3.path.style.access: true
    state.backend.type: hashmap
    execution.checkpointing.dir: s3://checkpoints/flink/checkpoints
    execution.checkpointing.savepoint-dir: s3://checkpoints/flink/savepoints
    restart-strategy.type: exponential-delay
    web.submit.enable: false

services:
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.3.2}
    profiles: [stream]
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
    - 127.0.0.1:9092:9092
    mem_limit: 1024m
    volumes:
    - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:4.3.2}
    profiles: [stream]
    entrypoint: [/bin/bash, /bootstrap/kafka-init.sh]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    volumes:
    - ./stream:/bootstrap:ro

  stream-minio-init:
    image: ${MINIO_MC_IMAGE:?Run make env}
    profiles: [stream]
    entrypoint: [/bin/sh, /bootstrap/minio-init.sh]
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:?Run make env}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run make env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run make env}
      FLINK_S3_ACCESS_KEY: ${FLINK_S3_ACCESS_KEY:-}
      FLINK_S3_SECRET_KEY: ${FLINK_S3_SECRET_KEY:-}
    volumes:
    - ./stream:/bootstrap:ro

  kafka-ui:
    image: ${KAFKA_UI_IMAGE:-kafbat/kafka-ui:v1.5.0}
    profiles: [stream]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_READONLY: 'true'
      DYNAMIC_CONFIG_ENABLED: 'false'
      JAVA_OPTS: -Xmx256m
    ports:
    - 127.0.0.1:8085:8080
    mem_limit: 512m
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O- http://localhost:8080/actuator/health | grep -q UP
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  flink-jobmanager:
    image: omnichannel/flink:2.2.1-jobs
    build:
      context: ..
      dockerfile: docker/images/Dockerfile.flink
      args:
        FLINK_IMAGE: ${FLINK_IMAGE:-flink:2.2.1-java17}
    profiles: [stream]
    command: jobmanager
    environment: *flink-env
    ports:
    - 127.0.0.1:8082:8081
    mem_limit: 1024m
    depends_on:
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8081/overview >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  flink-taskmanager:
    image: omnichannel/flink:2.2.1-jobs
    build:
      context: ..
      dockerfile: docker/images/Dockerfile.flink
      args:
        FLINK_IMAGE: ${FLINK_IMAGE:-flink:2.2.1-java17}
    profiles: [stream]
    command: taskmanager
    environment: *flink-env
    mem_limit: 2048m
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://flink-jobmanager:8081/taskmanagers | grep -q '"slotsNumber"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  kafka-data: {}
