name: ${COMPOSE_PROJECT_NAME:-omnichannel-lakehouse}

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:?Run make env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make env}
  AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Run make env}
  LAKEKEEPER_DB_PASSWORD: ${LAKEKEEPER_DB_PASSWORD:?Run make env}
  MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD:?Run make env}
  GENERATOR_DB_PASSWORD: ${GENERATOR_DB_PASSWORD:?Run make env}
  SPARK_READER_DB_PASSWORD: ${SPARK_READER_DB_PASSWORD:?Run make env}
  SPARK_WRITER_DB_PASSWORD: ${SPARK_WRITER_DB_PASSWORD:?Run make env}
  TRINO_RO_DB_PASSWORD: ${TRINO_RO_DB_PASSWORD:?Run make env}
  DEBEZIUM_REPL_DB_PASSWORD: ${DEBEZIUM_REPL_DB_PASSWORD:?Run make env}

x-minio-env: &minio-env
  S3_ENDPOINT: ${S3_ENDPOINT:?Run make env}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run make env}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run make env}
  GENERATOR_S3_ACCESS_KEY: ${GENERATOR_S3_ACCESS_KEY:?Run make env}
  GENERATOR_S3_SECRET_KEY: ${GENERATOR_S3_SECRET_KEY:?Run make env}
  SPARK_S3_ACCESS_KEY: ${SPARK_S3_ACCESS_KEY:?Run make env}
  SPARK_S3_SECRET_KEY: ${SPARK_S3_SECRET_KEY:?Run make env}
  TRINO_S3_ACCESS_KEY: ${TRINO_S3_ACCESS_KEY:?Run make env}
  TRINO_S3_SECRET_KEY: ${TRINO_S3_SECRET_KEY:?Run make env}
  LAKEKEEPER_S3_ACCESS_KEY: ${LAKEKEEPER_S3_ACCESS_KEY:?Run make env}
  LAKEKEEPER_S3_SECRET_KEY: ${LAKEKEEPER_S3_SECRET_KEY:?Run make env}

services:
  postgres:
    image: ${POSTGRES_IMAGE:?Run make env}
    profiles: [core]
    environment:
      <<: *postgres-env
      POSTGRES_DB: postgres
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - max_slot_wal_keep_size=5GB
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  postgres-init:
    image: ${POSTGRES_IMAGE:?Run make env}
    profiles: [core]
    environment:
      <<: *postgres-env
      PGHOST: ${POSTGRES_HOST:?Run make env}
      PGDATABASE: postgres
    entrypoint: [/bin/sh, /bootstrap/postgres-init.sh]
    volumes:
      - ./core:/bootstrap:ro
      - ../sql/postgres:/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    restart: "no"

  minio:
    image: ${MINIO_IMAGE:?Run make env}
    build:
      context: images
      dockerfile: Dockerfile.minio
      target: server
    profiles: [core]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run make env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run make env}
    command: [server, /data, --console-address, ':9001']
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, --spider, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio-init:
    image: ${MINIO_MC_IMAGE:?Run make env}
    build:
      context: images
      dockerfile: Dockerfile.minio
      target: client
    profiles: [core]
    environment: *minio-env
    entrypoint: [/bin/sh, /bootstrap/minio-init.sh]
    volumes:
      - ./core:/bootstrap:ro
    depends_on:
      minio:
        condition: service_healthy
    mem_limit: 128m
    restart: "no"

volumes:
  postgres-data:
  minio-data:
