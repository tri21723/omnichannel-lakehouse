# Q1: Iceberg via Lakekeeper REST + MinIO, read-only credentials (ADR-0015).
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=${ENV:TRINO_ICEBERG_REST_URI}
iceberg.rest-catalog.warehouse=${ENV:TRINO_ICEBERG_WAREHOUSE}
iceberg.rest-catalog.security=NONE
iceberg.rest-catalog.vended-credentials-enabled=false
fs.s3.enabled=true
s3.endpoint=${ENV:TRINO_S3_ENDPOINT}
s3.region=${ENV:TRINO_S3_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:TRINO_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:TRINO_S3_SECRET_KEY}
# File-based system access control cannot restrict table procedures (ALTER TABLE ... EXECUTE),
# and REST commits are written by Lakekeeper, so the connector itself must be read-only.
iceberg.security=read_only
# Defense in depth: no snapshot or orphan file is young enough to be removed through Trino.
iceberg.expire-snapshots.min-retention=36500d
iceberg.remove-orphan-files.min-retention=36500d
