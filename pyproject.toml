[project]
name = "omnichannel-lakehouse"
version = "0.1.0"
description = "Local-first omnichannel e-commerce lakehouse"
requires-python = ">=3.11,<3.13"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["generators/tests", "spark/tests", "airflow/tests", "docker/core/tests", "docker/batch/tests", "docker/orch/tests", "docker/query/tests"]
addopts = "-ra"
