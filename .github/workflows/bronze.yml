name: Bronze integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bronze:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: make setup check env-batch config-batch
      - run: make build-generator build-batch up-batch
      - run: make gen-sources GEN_ARGS='--config generators/fixtures/bronze.yaml'
      - id: fixture
        run: |
          .venv/bin/python - <<'PYCODE'
          import os
          from pathlib import Path
          from generators.common.config import read_config
          run_id = read_config(Path("generators/fixtures/bronze.yaml")).run_id
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write(f"run_id={run_id}\n")
          PYCODE
      - run: make smoke-bronze BRONZE_RUN_ID=${{ steps.fixture.outputs.run_id }}
      - run: make test-bronze-recovery BRONZE_RUN_ID=${{ steps.fixture.outputs.run_id }}
      - run: make restart-lakehouse
      - env:
          RUN_ID: ${{ steps.fixture.outputs.run_id }}
        run: |
          make verify-bronze BRONZE_ARGS="--run-id $RUN_ID \
            --run-date 2026-01-01 --channel walmart --source jdbc --mode full"
      - if: always()
        run: make down
