name: Warehouse export integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  warehouse-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: make setup check env-silver config-batch
      - run: make build-generator build-batch up-batch
      - run: sh docker/batch/ci_run.sh make prepare-silver-fixture
      - run: sh docker/batch/ci_run.sh make integration-silver
      - run: sh docker/batch/ci_run.sh make smoke-gold
      - run: sh docker/batch/ci_run.sh make verify-gold
      - run: sh docker/batch/ci_run.sh make smoke-warehouse
      - run: sh docker/batch/ci_run.sh make verify-warehouse
      - run: sh docker/batch/ci_run.sh make reconcile-warehouse
      - run: sh docker/batch/ci_run.sh make test-warehouse-dq
      - run: sh docker/batch/ci_run.sh make test-warehouse-review
      - run: sh docker/batch/ci_run.sh make test-warehouse-recovery
      - run: make restart-core
      - run: make restart-lakehouse
      - run: sh docker/batch/ci_run.sh make verify-warehouse
      - if: always()
        run: make down
