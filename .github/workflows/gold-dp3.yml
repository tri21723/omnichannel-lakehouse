name: Gold and DP3 Features integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gold-dp3:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: make setup check env-silver config-batch
      - run: make build-generator build-batch up-batch
      - run: sh docker/batch/ci_run.sh make prepare-silver-fixture
      - run: sh docker/batch/ci_run.sh make integration-silver
      - run: sh docker/batch/ci_run.sh make integration-gold
      - run: sh docker/batch/ci_run.sh make test-gold-dq
      - run: sh docker/batch/ci_run.sh make test-gold-recovery
      - run: sh docker/batch/ci_run.sh make smoke-features
      - run: sh docker/batch/ci_run.sh make verify-features
      - run: sh docker/batch/ci_run.sh make smoke-labels
      - run: sh docker/batch/ci_run.sh make verify-labels
      - run: sh docker/batch/ci_run.sh make test-dp3-dq
      - run: sh docker/batch/ci_run.sh make test-dp3-recovery
      - run: sh docker/batch/ci_run.sh make integration-dp3
      - run: make restart-lakehouse
      - run: sh docker/batch/ci_run.sh make verify-features
      - run: sh docker/batch/ci_run.sh make verify-labels
      - if: always()
        run: make down
