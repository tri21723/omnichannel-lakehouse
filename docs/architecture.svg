  <text class="m" x="1118" y="545">customers,</text>
  <text class="m" x="1118" y="560">products, returns</text>
  <text class="m" x="1118" y="580">quarantine_*</text>
  <text class="s" x="1118" y="600">PII → HMAC</text>
  <rect class="box" x="1256" y="490" width="130" height="130" stroke="#fda4af"/>
  <text class="t" x="1268" y="510">GOLD</text>
  <text class="m" x="1268" y="530">dim_*, fact_*</text>
  <text class="s" x="1268" y="545">(dp2)</text>
  <text class="m" x="1268" y="568">feat_*, lbl_*</text>
  <text class="s" x="1268" y="583">(dp3)</text>
  <text class="s" x="1268" y="604">DECIMAL(18,2)</text>
