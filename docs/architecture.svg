  <rect width="1720" height="1060" fill="#ffffff"/>
  <text x="40" y="46" font-size="22" font-weight="800" fill="#111827" letter-spacing=".06em">OMNICHANNEL LAKEHOUSE · SYSTEM ARCHITECTURE</text>
  <text x="40" y="66" class="s">5 kênh: Walmart · Amazon · TikTok Shop · Shopee · Lazada — local Docker Compose trước, AWS sau</text>

  <!-- ============ GROUPS ============ -->
  <!-- Orchestration -->
  <rect class="grp" x="300" y="80" width="620" height="150" fill="#faf5ff" stroke="#9333ea"/>
  <text class="h tO" x="316" y="102">ORCHESTRATION · Airflow :8081</text>
  <rect class="box" x="316" y="114" width="222" height="104" stroke="#c084fc"/>
  <text class="s" x="328" y="136">• standalone: scheduler + webserver</text>
  <text class="s" x="328" y="156">• LocalExecutor, parallelism = 1</text>
  <text class="s" x="328" y="176">• spark-submit (client mode)</text>
  <text class="s" x="328" y="196">• metadata → DB airflow</text>
  <g class="m" text-anchor="middle">
    <rect class="box" x="556" y="118" width="110" height="34" stroke="#c084fc"/><text x="611" y="139">dp1_bronze</text>
