  <line x1="840" y1="546" x2="928" y2="546" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ac)"/>

  <!-- Lakehouse storage note -->
  <rect x="910" y="640" width="300" height="100" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="926" y="662" font-size="13" font-weight="700" fill="#0f172a">Lưu trữ của lakehouse</text>
  <text x="926" y="682" font-size="12" fill="#334155">data + metadata: MinIO s3://lakehouse</text>
  <text x="926" y="700" font-size="12" fill="#334155">catalog DB: PostgreSQL (lakekeeper)</text>
  <text x="926" y="718" font-size="12" fill="#334155">ledger /runtime: pin snapshot mỗi tầng</text>
  <line x1="1060" y1="638" x2="1060" y2="602" stroke="#475569" stroke-width="1.4" stroke-dasharray="4 3"/>

