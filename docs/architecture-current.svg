  <rect x="1260" y="200" width="240" height="92" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1272" y="222" font-size="13" font-weight="700" fill="#0f172a">Trino 484 · :8083 · chỉ đọc</text>
  <text x="1272" y="242" font-size="12" fill="#334155">iceberg: silver · gold</text>
  <text x="1272" y="260" font-size="12" fill="#334155">postgresql: walmart · warehouse</text>
  <text x="1272" y="278" font-size="12" fill="#334155">PII che · bronze ẩn</text>

  <rect x="1530" y="215" width="140" height="60" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="1542" y="240" font-size="13" font-weight="700" fill="#0f172a">DBeaver</text>
  <text x="1542" y="260" font-size="12" fill="#334155">JDBC · SQL mẫu</text>

  <rect x="1260" y="395" width="240" height="75" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="1272" y="417" font-size="13" font-weight="700" fill="#0f172a">PostgreSQL · sources.warehouse</text>
  <text x="1272" y="437" font-size="12" fill="#334155">8 bảng star schema · 30 ngày</text>
  <text x="1272" y="455" font-size="12" fill="#334155">NUMERIC(18,2) · PK/FK</text>

  <rect x="1260" y="490" width="410" height="140" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1272" y="512" font-size="14" font-weight="700" fill="#0f172a">DataHub v1.7 · UI :9002</text>
  <g font-size="12" fill="#334155">
    <text x="1272" y="532">GMS (không port host) · frontend · OpenSearch 2.19</text>
    <text x="1272" y="551">store: PostgreSQL (datahub) + Kafka của nền tảng</text>
    <text x="1272" y="570">recipe chỉ đọc: postgres · iceberg · kafka (không profiling)</text>
    <text x="1272" y="589">lineage từ ledger + DagBag Airflow (12 flow / 39 job)</text>
    <text x="1272" y="608">tag PII · domain · glossary · owner · assertion G1</text>
  </g>

