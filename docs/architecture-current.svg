  <line x1="590" y1="688" x2="522" y2="688" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="530" y="703" font-size="11" fill="#b91c1c">.dlq</text>
  <line x1="715" y1="700" x2="715" y2="728" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="722" y="719" font-size="11" fill="#b91c1c">FileSink exactly-once</text>

