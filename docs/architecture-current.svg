    <rect x="760" y="864" width="18" height="14" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="786" y="876">stream · Kafka, kafka-ui, Flink</text>
    <rect x="1010" y="864" width="18" height="14" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="1036" y="876">cdc · Kafka Connect + Debezium</text>
    <rect x="1270" y="864" width="18" height="14" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="1296" y="876">governance · DataHub</text>
