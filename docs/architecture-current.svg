  <line x1="840" y1="245" x2="928" y2="245" stroke="#334155" stroke-width="1.6" marker-end="url(#ag)"/>
  <polyline points="840,300 885,300 885,330 928,330" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ag)"/>
  <polyline points="840,355 875,355 875,400 928,400" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ag)"/>
