  <rect x="910" y="190" width="300" height="410" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="926" y="212" font-size="14" font-weight="700" fill="#0f172a">Iceberg v2 · Lakekeeper REST :8181</text>
  <g font-size="12" fill="#334155">
    <rect x="930" y="225" width="260" height="62" rx="6" fill="#fdf0e1" stroke="#b45309"/>
    <text x="942" y="245" font-weight="700" fill="#0f172a">bronze</text>
    <text x="942" y="263">&lt;channel&gt;_orders_raw · walmart_*_raw</text>
