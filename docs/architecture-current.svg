  <g font-size="12" fill="#334155">
    <line x1="30" y1="932" x2="80" y2="932" stroke="#334155" stroke-width="1.6" marker-end="url(#ag)"/><text x="90" y="936">dữ liệu (màu theo luồng: batch · CDC · streaming)</text>
    <line x1="440" y1="932" x2="490" y2="932" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#at)"/><text x="500" y="936">điều phối (Airflow)</text>
