<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1000" viewBox="0 0 1700 1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Omnichannel Lakehouse — kiến trúc hiện tại (v0.9-governance)</title>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>

  <rect width="1700" height="1000" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="40" font-size="22" font-weight="700" fill="#0f172a">Omnichannel Lakehouse — kiến trúc hiện tại</text>
  <text x="30" y="64" font-size="13" fill="#475569">v0.9-governance · chạy local bằng Docker Compose · mọi thành phần trong hình đã triển khai và kiểm chứng · màu viền = profile Compose</text>

  <!-- Lanes -->
  <rect x="20" y="175" width="1660" height="250" rx="8" fill="#f8fafc"/>
  <rect x="20" y="430" width="1660" height="180" rx="8" fill="#f3faf5"/>
  <rect x="20" y="615" width="1660" height="195" rx="8" fill="#fdf5f5"/>
  <text x="30" y="192" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">BATCH</text>
  <text x="30" y="447" font-size="11" font-weight="700" fill="#15803d" letter-spacing="1">CDC</text>
  <text x="30" y="632" font-size="11" font-weight="700" fill="#b91c1c" letter-spacing="1">STREAMING</text>

  <!-- Airflow (orch) -->
  <rect x="570" y="84" width="640" height="76" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="586" y="106" font-size="14" font-weight="700" fill="#0f172a">Airflow 3.3.2 · :8081 · LocalExecutor (cũng là Spark driver)</text>
  <text x="586" y="126" font-size="12" fill="#334155">batch_daily → dp1_bronze → dp2_silver → dp2_gold → dp3_features / labels → dp4_warehouse</text>
  <text x="586" y="145" font-size="12" fill="#334155">dp1_stream_bronze · dp1_cdc (10 phút) · query_checks · maintenance_iceberg · datahub_ingest</text>
  <line x1="715" y1="160" x2="715" y2="188" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#at)"/>
  <text x="723" y="179" font-size="11" fill="#0f766e">spark-submit · khoá driver</text>
  <polyline points="1210,110 1688,110 1688,570 1672,570" fill="none" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#at)"/>
  <text x="1500" y="103" font-size="11" fill="#0f766e">datahub_ingest</text>

  <!-- Column 1: generators (tooling) -->
  <g font-size="12" fill="#334155">
    <rect x="40" y="205" width="180" height="60" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <text x="52" y="228" font-size="13" font-weight="700" fill="#0f172a">Generator batch</text>
    <text x="52" y="248">JSONL 5 kênh · --seed</text>

    <rect x="40" y="330" width="180" height="60" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <text x="52" y="353" font-size="13" font-weight="700" fill="#0f172a">Generator load</text>
    <text x="52" y="373">Walmart OLTP</text>

    <rect x="40" y="490" width="180" height="60" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <text x="52" y="513" font-size="13" font-weight="700" fill="#0f172a">Kịch bản CDC</text>
    <text x="52" y="533">tiền tố id riêng</text>

    <rect x="40" y="680" width="180" height="60" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <text x="52" y="703" font-size="13" font-weight="700" fill="#0f172a">Generator stream</text>
    <text x="52" y="723">trễ · trùng · burst</text>
  </g>

  <!-- Column 2: landing and transport -->
  <g font-size="12" fill="#334155">
    <rect x="270" y="195" width="250" height="85" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="282" y="217" font-size="13" font-weight="700" fill="#0f172a">MinIO · s3://raw</text>
    <text x="282" y="237">&lt;channel&gt;/dt=…/run_id=…/*.jsonl</text>
    <text x="282" y="256">manifests/ · ground truth</text>
    <text x="282" y="272" font-size="11" fill="#64748b">:9000 · console :9001</text>

    <rect x="270" y="315" width="250" height="120" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="282" y="337" font-size="13" font-weight="700" fill="#0f172a">PostgreSQL 16 · sources.walmart</text>
    <text x="282" y="357">customers · orders · order_items</text>
    <text x="282" y="376">products · returns</text>
    <text x="282" y="395">publication dbz_pub (chỉ orders)</text>
    <text x="282" y="425" font-size="11" fill="#64748b">:5432</text>

    <rect x="270" y="470" width="250" height="62" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="282" y="492" font-size="13" font-weight="700" fill="#0f172a">Kafka Connect · Debezium 3.6</text>
    <text x="282" y="512">slot dbz_walmart · heartbeat</text>
    <text x="282" y="526" font-size="11" fill="#64748b">không port host</text>

    <rect x="270" y="630" width="250" height="165" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="282" y="652" font-size="13" font-weight="700" fill="#0f172a">Kafka 4.3.2 (KRaft) · :9092</text>
    <text x="282" y="674">amazon.order-notifications</text>
    <text x="282" y="693">tiktok_shop.order-webhooks</text>
    <text x="282" y="712">*.dlq</text>
    <text x="282" y="731">platform_cdc.walmart.orders</text>
    <text x="282" y="750">platform_cdc.signals</text>
    <text x="282" y="782" font-size="11" fill="#64748b">kafka-ui :8085</text>
  </g>

  <!-- C1 → C2 -->
  <line x1="220" y1="235" x2="268" y2="235" stroke="#334155" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="220" y1="360" x2="268" y2="360" stroke="#334155" stroke-width="1.6" marker-end="url(#ag)"/>
  <polyline points="220,520 245,520 245,420 268,420" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ac)"/>
  <line x1="220" y1="710" x2="268" y2="710" stroke="#dc2626" stroke-width="1.6" marker-end="url(#ar)"/>
  <!-- PG → Debezium → Kafka -->
  <line x1="395" y1="435" x2="395" y2="468" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ac)"/>
  <text x="402" y="456" font-size="11" fill="#15803d">WAL</text>
  <line x1="395" y1="532" x2="395" y2="628" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ac)"/>
  <text x="402" y="585" font-size="11" fill="#15803d">change events</text>

  <!-- Column 3: Spark (batch) -->
  <rect x="570" y="190" width="290" height="410" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="586" y="212" font-size="14" font-weight="700" fill="#0f172a">Spark 3.5.5 · master + 2 worker</text>
  <g font-size="12" fill="#334155">
    <rect x="590" y="225" width="250" height="40" rx="6" fill="#ffffff" stroke="#fdba74"/>
    <text x="602" y="250"><tspan font-weight="700" fill="#0f172a">dp1_bronze</tspan> · jsonl / jdbc / stream</text>
    <rect x="590" y="280" width="250" height="40" rx="6" fill="#ffffff" stroke="#fdba74"/>
    <text x="602" y="305"><tspan font-weight="700" fill="#0f172a">dp2_silver</tspan> · dedup · HMAC · quarantine</text>
    <rect x="590" y="335" width="250" height="40" rx="6" fill="#ffffff" stroke="#fdba74"/>
    <text x="602" y="360"><tspan font-weight="700" fill="#0f172a">dp2_gold</tspan> · star schema</text>
    <rect x="590" y="390" width="250" height="40" rx="6" fill="#ffffff" stroke="#fdba74"/>
    <text x="602" y="415"><tspan font-weight="700" fill="#0f172a">dp3_features · dp3_return_labels</tspan></text>
    <rect x="590" y="445" width="250" height="40" rx="6" fill="#ffffff" stroke="#fdba74"/>
    <text x="602" y="470"><tspan font-weight="700" fill="#0f172a">dp4_warehouse</tspan> · cửa sổ 30 ngày</text>
    <rect x="590" y="530" width="250" height="40" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="602" y="555"><tspan font-weight="700" fill="#0f172a">dp1_cdc</tspan> · MERGE theo (lsn, offset)</text>
  </g>
  <text x="586" y="590" font-size="11" fill="#9a3412">:7077 · UI :8080 · Iceberg 1.9.2</text>

  <!-- Flink and stream output -->
  <rect x="590" y="640" width="250" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="602" y="663" font-size="13" font-weight="700" fill="#0f172a">Flink 2.2.1 · :8082</text>
  <text x="602" y="683" font-size="12" fill="#334155">amazon_late · tiktok_dedup (Java)</text>
  <rect x="590" y="730" width="250" height="60" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="602" y="753" font-size="13" font-weight="700" fill="#0f172a">MinIO · s3://raw/stream/&lt;channel&gt;</text>
  <text x="602" y="773" font-size="12" fill="#334155">accepted · late · duplicates · windows</text>

  <!-- C2 → Spark -->
  <line x1="520" y1="240" x2="588" y2="240" stroke="#334155" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="530" y="233" font-size="11" fill="#334155">jsonl</text>
  <polyline points="520,345 556,345 556,252 588,252" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="526" y="339" font-size="11" fill="#334155">JDBC</text>
