    <rect x="930" y="305" width="260" height="62" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="942" y="325" font-weight="700" fill="#0f172a">silver</text>
    <text x="942" y="343">orders · order_items · customers · products</text>
    <text x="942" y="360">returns · _contrib_* · quarantine_*</text>

    <rect x="930" y="385" width="260" height="82" rx="6" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="942" y="405" font-weight="700" fill="#0f172a">gold</text>
    <text x="942" y="423">dim_* ×5 · fact_* ×3</text>
    <text x="942" y="440">feat_customer_daily · feat_product_daily</text>
    <text x="942" y="457">lbl_order_return</text>

    <rect x="930" y="515" width="260" height="62" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="942" y="535" font-weight="700" fill="#0f172a">CDC · bronze.walmart_orders_cdc</text>
    <text x="942" y="553">→ silver.walmart_orders_cdc_current</text>
    <text x="942" y="570">+ silver.quarantine_walmart_orders_cdc</text>
  </g>
  <line x1="1060" y1="287" x2="1060" y2="303" stroke="#334155" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="1060" y1="367" x2="1060" y2="383" stroke="#334155" stroke-width="1.6" marker-end="url(#ag)"/>

